<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Nadia Cañadas Giménez</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/' | relative_url }}">NCG</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">About</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button class="theme-toggle" aria-label="Switch theme"><span class="theme-icon">🌙</span></button>
        <button class="lang-toggle" aria-label="Switch language">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenu injecté par les pages -->
  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez ·
      <a href="https://www.linkedin.com/in/ncgimenez" target="_blank" rel="noopener">LinkedIn</a>
      · <a href="mailto:ncgimenez@proton.me">ncgimenez@proton.me</a>
    </p>
    <p style="margin-top: 0.75rem; text-align: center;">
      <a class="cle-secrete" href="{{ '/antechamber/' | relative_url }}" title="Enter the antechamber & audio lab" aria-label="Enter the antechamber">🗝</a>
    </p>
  </footer>

  <!-- Script global de thèmes et langue -->
  <script src="{{ '/assets/lang.js' | relative_url }}"></script>

  {% if page.mermaid %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#ffffff',
        primaryTextColor: '#1f2430',
        primaryBorderColor: '#e6dfd3',
        lineColor: '#5b6272',
        background: '#faf7f2',
        fontSize: '13px'
      }
    });
  </script>
  {% endif %}

</body>
</html>
