<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | The Antechamber</title>
  <link rel="stylesheet" href="{{ '/assets/style.css?v=2.5' | relative_url }}">

  <style>
    /* ============================================================
       Antichambre : Sanctuarisation des couleurs (Atelier créatif)
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) : Neon Workshop & Ultraviolet */
    :root,
    :root[data-theme="dark"],
    :root:not([data-theme="light"]) {
      --fond: #0d0b14 !important;
      --fond-carte: #171324 !important;
      --texte: #f3e8ff !important;
      --texte-doux: #9484b8 !important;
      --accent: #9d5cff !important;
      --accent-fonce: #c084fc !important;
      --ligne: #2e2646 !important;
      --halo-couleur: rgba(157, 92, 255, 0.18);
    }

    /* 2. Mode clair adouci : Grège lin & Myrtille sourde */
    :root[data-theme="light"] {
      --fond: #e9e5ee !important;
      --fond-carte: #f2eef6 !important;
      --texte: #24202b !important;
      --texte-doux: #6c6677 !important;
      --accent: #58437a !important;
      --accent-fonce: #43325e !important;
      --ligne: #d6d0df !important;
      --halo-couleur: rgba(88, 67, 122, 0.05);
    }

    /* Halo lumineux d'ambiance */
    body {
      background-color: var(--fond) !important;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, var(--halo-couleur), transparent) !important;
      background-repeat: no-repeat !important;
      transition: background-color 0.25s ease;
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/antechamber/' | relative_url }}">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/projects/' | relative_url }}">Lab</a></li>
          <li><a href="{{ '/antechamber/notes/' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">Behind the Curtain</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button type="button" class="cmd-k-btn" id="cmd-k-trigger" aria-label="Open Quick Actions (⌘K)" title="Quick Actions (⌘K)">
          <span class="cmd-k-btn-icon">⚡</span>
          <span class="cmd-k-btn-text">Actions</span>
          <kbd class="cmd-k-btn-kbd">⌘K</kbd>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
          <span class="theme-icon">☀️</span>
        </button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span> 
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez</p>
    <p style="margin-top: 0.75rem; text-align: center;">
      <a href="{{ '/' | relative_url }}" style="color: var(--texte-doux); text-decoration: none; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 6px;" title="Back to main portfolio" aria-label="Back to main portfolio">
        <span>💼</span>
        <span style="font-size: 0.85rem; font-family: -apple-system, sans-serif;">Exit to Main Portfolio</span>
      </a>
    </p>
  <script>
    (function() {
      const themeBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const themeIcon = document.querySelector('.theme-icon');
      
      const currentTheme = localStorage.getItem('ncg-theme') || localStorage.getItem('theme') || 'dark';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeIcon) {
          themeIcon.textContent = (theme === 'dark') ? '☀️' : '🌙';
        }
      }

      setTheme(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          const isDark = (root.getAttribute('data-theme') || root.dataset.theme) === 'dark';
          playMechanicalClick();
          setTheme(isDark ? 'light' : 'dark');
        });
      }
    })();
  </script>
  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
  <script src="{{ '/assets/quick-actions.js' | relative_url }}"></script>
</body>
</html>
