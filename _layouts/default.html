<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · Nadia Cañadas Giménez{% else %}Nadia Cañadas Giménez · Product Builder & Analyst{% endif %}</title>
  <meta name="description" content="Portfolio of Nadia Cañadas Giménez — Product Builder & Analyst. Designing focused digital products, from workflow architecture to interface detail.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css?v=2.9' | relative_url }}">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('ncg-theme-v2');
      const theme = savedTheme ? savedTheme : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  {% if page.mermaid %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#16141c',
        primaryColor: '#9d5cff',
        primaryTextColor: '#f4f2f7',
        primaryBorderColor: 'rgba(255,255,255,0.15)',
        lineColor: '#f0714b',
        secondaryColor: '#1c1924',
        tertiaryColor: '#0e0d11'
      }
    });
  </script>
  {% endif %}
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/' | relative_url }}">Nadia Cañadas Giménez</a>
      
      <nav aria-label="Navigation principale">
        <ul>
          <li><a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Work</a></li>
          <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Notes</a></li>
          <li><a href="{{ '/about.html' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a></li>
          <li><a href="https://www.linkedin.com/in/ncgimenez" target="_blank" rel="noopener">LinkedIn ↗</a></li>
        </ul>
      </nav>

    <div class="controles-header">
      <button type="button" class="cmd-k-btn" id="cmd-k-trigger" aria-label="Open Quick Actions (⌘K)" title="Quick Actions (⌘K)">
        <span class="cmd-k-btn-icon">⚡</span>
        <span class="cmd-k-btn-text">Actions</span>
        <kbd class="cmd-k-btn-kbd">⌘K</kbd>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de thème" title="Passer en mode sombre">
        <span class="theme-icon">🌙</span>
      </button>
    </div>

  </header>

  {{ content }}

  <footer>
    <div style="max-width: var(--largeur); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
      <p style="margin: 0; font-size: 0.88rem; color: var(--texte-muté);">
        © {{ 'now' | date: "%Y" }} Nadia Cañadas Giménez · Built with care in Belgium.
      </p>
      <div>
        <a class="cle-secrete" href="{{ '/antechamber/' | relative_url }}" title="Entrer dans l'Antichambre" aria-label="Entrer dans l'Antichambre">🗝️</a>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      const themeBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const themeIcon = document.querySelector('.theme-icon');
      
      const savedTheme = localStorage.getItem('ncg-theme-v2');
      const currentTheme = savedTheme ? savedTheme : 'light';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme-v2', theme);
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeIcon) {
          themeIcon.textContent = (theme === 'dark') ? '☀️' : '🌙';
        }
        if (themeBtn) {
          themeBtn.setAttribute('title', theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre');
          themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre');
        }
      }

      setTheme(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          const isDark = (root.getAttribute('data-theme') || root.dataset.theme) === 'dark';
          playMechanicalClick();
          setTheme(isDark ? 'light' : 'dark');
        });
      }
    })();
  </script>
  <script src="{{ '/assets/quick-actions.js' | relative_url }}"></script>
</body>
</html>
