<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · Nadia Cañadas Giménez{% else %}Nadia Cañadas Giménez · Product & Systems Engineer{% endif %}</title>
  <meta name="description" content="Portfolio of Nadia Cañadas Giménez — Product Engineer & Systems Architect. ERP logic, tactile PWA interfaces, and interaction design.">
  
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  {% if page.mermaid %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#16141c',
        primaryColor: '#9d5cff',
        primaryTextColor: '#f4f2f7',
        primaryBorderColor: 'rgba(255,255,255,0.15)',
        lineColor: '#f0714b',
        secondaryColor: '#1c1924',
        tertiaryColor: '#0e0d11'
      }
    });
  </script>
  {% endif %}
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/' | relative_url }}">Nadia Cañadas Giménez</a>
      
      <nav aria-label="Navigation principale">
        <ul>
          <li><a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Work</a></li>
          <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Notes</a></li>
          <li><a href="{{ '/about.html' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a></li>
        </ul>
      </nav>

    <div class="controles-header">
      <button type="button" class="cmd-k-trigger" id="cmd-k-trigger" aria-label="Open Command Palette (Cmd+K)">
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>
      <button type="button" class="theme-toggle-switch" id="theme-toggle" aria-label="Changer de thème" role="switch">
        <span class="switch-indicators">
          <span class="switch-indicator--sun">☀️</span>
          <span class="switch-indicator--moon">🌙</span>
        </span>
        <span class="switch-lever"></span>
      </button>
    </div>

  </header>

  {{ content }}

  <footer>
    <div style="max-width: var(--largeur); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
      <p style="margin: 0; font-size: 0.88rem; color: var(--texte-muté);">
        © {{ 'now' | date: "%Y" }} Nadia Cañadas Giménez · Built with care in Belgium.
      </p>
      <div>
        <a class="cle-secrete" href="{{ '/antechamber/' | relative_url }}" title="Entrer dans l'Antichambre" aria-label="Entrer dans l'Antichambre">🗝️</a>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      const themeBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      
      const currentTheme = localStorage.getItem('ncg-theme') || localStorage.getItem('theme') || 'dark';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeBtn) {
          themeBtn.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
        }
      }

      setTheme(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          const isDark = (root.getAttribute('data-theme') || root.dataset.theme) === 'dark';
          playMechanicalClick();
          setTheme(isDark ? 'light' : 'dark');
        });
      }
    })();
  </script>
  
  <script src="{{ '/assets/cmd-k.js' | relative_url }}"></script>
</body>
</html>
