<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | The Antechamber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css?v=2.7' | relative_url }}">

  <style>
    /* ============================================================
       Antichambre : Sanctuarisation des couleurs (Atelier créatif & Poster Gallery)
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) : Neon Workshop & Ultraviolet Noir */
    :root,
    :root[data-theme="dark"],
    :root:not([data-theme="light"]) {
      --fond: #0b0912 !important;
      --fond-carte: #14111f !important;
      --fond-carte-hover: #1c182d !important;
      --texte: #f4eeff !important;
      --texte-doux: #9d91ba !important;
      --texte-mute: #6b5f88 !important;
      --accent: #a855f7 !important;
      --accent-fonce: #c084fc !important;
      --accent-or: #f59e0b !important;
      --accent-cyan: #38bdf8 !important;
      --ligne: #27203b !important;
      --ligne-fine: rgba(255, 255, 255, 0.08);
      --halo-couleur: rgba(168, 85, 247, 0.16);
      --font-poster-sans: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-poster-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* 2. Mode clair adouci : Grège d'Atelier & Myrtille Sombre */
    :root[data-theme="light"] {
      --fond: #f2edf7 !important;
      --fond-carte: #ffffff !important;
      --fond-carte-hover: #f9f7fc !important;
      --texte: #1d1929 !important;
      --texte-doux: #5f5478 !important;
      --texte-mute: #8c82a5 !important;
      --accent: #7e22ce !important;
      --accent-fonce: #6b21a8 !important;
      --accent-or: #d97706 !important;
      --accent-cyan: #0284c7 !important;
      --ligne: #ded4ea !important;
      --ligne-fine: rgba(0, 0, 0, 0.08);
      --halo-couleur: rgba(126, 34, 206, 0.07);
    }

    /* Halo lumineux d'ambiance et grain */
    body {
      background-color: var(--fond) !important;
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% -10%, var(--halo-couleur), transparent),
        radial-gradient(ellipse 60% 40% at 85% 60%, rgba(56, 189, 248, 0.05), transparent) !important;
      background-repeat: no-repeat !important;
      transition: background-color 0.25s ease;
      color: var(--texte);
    }

    /* Poster Header & Typography */
    .poster-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    .poster-supertitle-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--ligne);
      padding-bottom: 0.85rem;
      margin-bottom: 2rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--texte-mute);
    }

    .poster-secret-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: var(--accent-fonce);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* Huge Split Typography Title */
    .poster-hero-split {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .poster-split-top {
      font-family: var(--font-poster-sans);
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--texte);
      margin: 0;
    }

    .poster-split-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    .poster-split-bottom {
      font-family: var(--font-poster-sans);
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.25);
    }

    .poster-split-subscript {
      font-family: var(--font-poster-serif);
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      font-style: italic;
      color: var(--texte-doux);
      line-height: 1.2;
      max-width: 440px;
      margin: 0;
      padding-bottom: 0.5rem;
    }

    /* Asymmetric Poster Main Grid */
    .poster-editorial-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2.5rem;
      align-items: stretch;
      margin: 2.5rem 0 4rem;
    }

    @media (max-width: 860px) {
      .poster-editorial-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Frame Styling with Architectural Crosshairs */
    .poster-frame {
      position: relative;
      background: var(--fond-carte);
      border: 1px solid var(--ligne);
      border-radius: 12px;
      padding: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poster-frame::before {
      content: '+';
      position: absolute;
      top: 8px;
      left: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--texte-mute);
      opacity: 0.6;
    }

    .poster-frame::after {
      content: '+';
      position: absolute;
      top: 8px;
      right: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--texte-mute);
      opacity: 0.6;
    }

    .poster-vertical-meta {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--texte-mute);
      opacity: 0.75;
      position: absolute;
      right: 14px;
      bottom: 24px;
      pointer-events: none;
    }

    /* Photography Section */
    .gallery-section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
      border-top: 1px solid var(--ligne);
      padding-top: 3.5rem;
      margin-top: 4rem;
      margin-bottom: 2rem;
    }

    .gallery-title {
      font-family: var(--font-poster-sans);
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0 0 0.5rem;
      color: var(--texte);
    }

    .gallery-subtitle {
      font-family: var(--font-poster-serif);
      font-size: 1.3rem;
      font-style: italic;
      color: var(--texte-doux);
      margin: 0;
      max-width: 620px;
      line-height: 1.45;
    }

    /* Photography Grid */
    .photo-exhibition-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }

    .photo-plate {
      background: var(--fond-carte);
      border: 1px solid var(--ligne);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .photo-plate:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    .photo-viewfinder {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 8px;
      overflow: hidden;
      background: #0f0d16;
      border: 1px solid var(--ligne-fine);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-viewfinder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .photo-plate:hover .photo-viewfinder img {
      transform: scale(1.03);
    }

    .photo-plate-caption {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--ligne);
    }

    .photo-plate-num {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-fonce);
      margin-bottom: 4px;
    }

    .photo-plate-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--texte);
      margin: 0 0 6px;
    }

    .photo-plate-notes {
      font-size: 0.88rem;
      color: var(--texte-doux);
      line-height: 1.5;
      margin: 0 0 10px;
    }

    .photo-plate-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--texte-mute);
      padding-top: 8px;
      border-top: 1px dashed var(--ligne);
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/antechamber/' | relative_url }}" style="font-family: var(--font-poster-sans); font-weight: 800; letter-spacing: -0.01em;">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/' | relative_url }}" aria-current="page">Poster &amp; Lab</a></li>
          <li><a href="{{ '/antechamber/notes.html' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">Behind the Curtain</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button type="button" class="cmd-k-btn" id="cmd-k-trigger" aria-label="Open Quick Actions (⌘K)" title="Quick Actions (⌘K)">
          <span class="cmd-k-btn-icon">⚡</span>
          <span class="cmd-k-btn-text">Actions</span>
          <kbd class="cmd-k-btn-kbd">⌘K</kbd>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
          <span class="theme-icon">☀️</span>
        </button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span> 
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez · The Antechamber</p>
    <p style="margin-top: 0.75rem; text-align: center;">
      <a href="{{ '/' | relative_url }}" style="color: var(--texte-doux); text-decoration: none; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 8px;" title="Back to main portfolio" aria-label="Back to main portfolio">
        <span>💼</span>
        <span style="font-size: 0.85rem; font-family: -apple-system, sans-serif;">Exit to Main Portfolio</span>
      </a>
    </p>
  </footer>

  <script>
    (function() {
      const themeBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const themeIcon = document.querySelector('.theme-icon');
      
      const currentTheme = localStorage.getItem('ncg-theme') || localStorage.getItem('theme') || 'dark';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeIcon) {
          themeIcon.textContent = (theme === 'dark') ? '☀️' : '🌙';
        }
      }

      setTheme(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          const isDark = (root.getAttribute('data-theme') || root.dataset.theme) === 'dark';
          playMechanicalClick();
          setTheme(isDark ? 'light' : 'dark');
        });
      }
    })();
  </script>
  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
  <script src="{{ '/assets/quick-actions.js' | relative_url }}"></script>
</body>
</html>
