<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | The Antechamber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css?v=2.8' | relative_url }}">

  <style>
    /* ============================================================
       Antichambre : Sanctuarisation des couleurs (Atelier créatif & Poster Gallery)
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) : Neon Workshop & Ultraviolet Noir */
    :root,
    :root[data-theme="dark"] {
      --fond: #0b0912 !important;
      --fond-carte: #14111f !important;
      --fond-carte-hover: #1c182d !important;
      --canvas-bg: #0d0a16 !important;
      --sub-card-bg: #120e20 !important;
      --texte: #f4eeff !important;
      --texte-doux: #9d91ba !important;
      --texte-mute: #6b5f88 !important;
      --accent: #a855f7 !important;
      --accent-fonce: #c084fc !important;
      --accent-or: #f59e0b !important;
      --accent-cyan: #38bdf8 !important;
      --ligne: #27203b !important;
      --ligne-fine: rgba(255, 255, 255, 0.08);
      --halo-couleur: rgba(168, 85, 247, 0.16);
      --shadow-poster: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(168, 85, 247, 0.08);
      --stage-mat-bg: #08060e;
      --font-poster-sans: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-poster-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* 2. Mode clair adouci : Grège d'Atelier & Myrtille Sombre */
    :root[data-theme="light"] {
      --fond: #f2edf7 !important;
      --fond-carte: #ffffff !important;
      --fond-carte-hover: #f9f7fc !important;
      --canvas-bg: #faf7fd !important;
      --sub-card-bg: #ffffff !important;
      --texte: #1d1929 !important;
      --texte-doux: #5f5478 !important;
      --texte-mute: #8c82a5 !important;
      --accent: #7e22ce !important;
      --accent-fonce: #6b21a8 !important;
      --accent-or: #d97706 !important;
      --accent-cyan: #0284c7 !important;
      --ligne: #ded4ea !important;
      --ligne-fine: rgba(0, 0, 0, 0.08);
      --halo-couleur: rgba(126, 34, 206, 0.08);
      --shadow-poster: 0 16px 40px rgba(95, 84, 120, 0.1);
      --stage-mat-bg: #130f1d;
    }

    /* Halo lumineux d'ambiance et grain */
    body {
      background-color: var(--fond) !important;
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% -10%, var(--halo-couleur), transparent),
        radial-gradient(ellipse 60% 40% at 85% 60%, rgba(56, 189, 248, 0.05), transparent) !important;
      background-repeat: no-repeat !important;
      transition: background-color 0.25s ease, color 0.25s ease;
      color: var(--texte) !important;
    }

    /* ============================================================
       ART POSTER CANVAS & MULTI-DIRECTIONAL EDITORIAL TYPOGRAPHY
       ============================================================ */
    .art-poster-canvas {
      max-width: 1240px;
      margin: 1.5rem auto 4rem;
      padding: 2rem 2.5rem;
      border: 1px solid var(--ligne) !important;
      background: var(--canvas-bg) !important;
      position: relative;
      box-shadow: var(--shadow-poster) !important;
      border-radius: 6px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    @media (max-width: 768px) {
      .art-poster-canvas {
        padding: 1.25rem;
        margin: 0.75rem auto 2.5rem;
      }
    }

    /* Corner Registration Crosshairs */
    .corner-mark {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.7;
      line-height: 1;
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 10px; }
    .corner-tr { top: 8px; right: 10px; }
    .corner-bl { bottom: 8px; left: 10px; }
    .corner-br { bottom: 8px; right: 10px; }

    /* Vertical Text Columns on Poster Edges */
    .poster-spine-left {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%) rotate(180deg);
      writing-mode: vertical-rl;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--texte-mute);
      pointer-events: none;
      white-space: nowrap;
    }

    .poster-spine-right {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--texte-mute);
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .poster-spine-left,
      .poster-spine-right {
        display: none;
      }
    }

    /* Top Masthead Row */
    .poster-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--ligne);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--texte-mute);
    }

    .poster-secret-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: var(--accent-fonce);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* Hero Headline & Interlocked Title */
    .poster-hero-interlock {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: flex-end;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--ligne);
    }

    @media (max-width: 768px) {
      .poster-hero-interlock {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }

    .poster-main-title {
      font-family: var(--font-poster-sans);
      font-size: clamp(2.6rem, 6.5vw, 5.2rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--texte);
      margin: 0;
    }

    /* "THE" in small uppercase matching the same font */
    .poster-the-small {
      font-family: inherit;
      font-size: 0.38em;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-fonce);
      display: inline-block;
      vertical-align: 0.22em;
      margin-right: 0.45rem;
    }

    .poster-title-highlight {
      color: var(--accent);
      text-shadow: 0 0 35px rgba(168, 85, 247, 0.35);
    }

    .poster-curator-statement {
      font-family: var(--font-poster-serif);
      font-size: clamp(1.2rem, 2.2vw, 1.6rem);
      font-style: italic;
      color: var(--texte-doux);
      line-height: 1.35;
      margin: 0;
      border-left: 2px solid var(--accent);
      padding-left: 1.25rem;
    }

    /* Asymmetric Exhibition Center */
    .poster-center-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2rem;
      align-items: stretch;
      margin-bottom: 2rem;
    }

    @media (max-width: 960px) {
      .poster-center-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Exhibition Frame (The Lens & Filmstrip) */
    .exhibition-view-card {
      background: var(--sub-card-bg) !important;
      border: 1px solid var(--ligne) !important;
      border-radius: 8px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.25s ease;
    }

    .exhibition-frame-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--stage-mat-bg) !important;
      border: 1px solid var(--ligne-fine);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Filmstrip Selector */
    .filmstrip-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .filmstrip-thumb {
      background: var(--fond-carte) !important;
      border: 1px solid var(--ligne) !important;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      color: var(--texte-doux);
    }

    .filmstrip-thumb:hover,
    .filmstrip-thumb.active {
      border-color: var(--accent) !important;
      background: rgba(168, 85, 247, 0.14) !important;
      color: var(--texte);
    }

    .filmstrip-thumb.active {
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }

    .filmstrip-thumb-num {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--accent-fonce);
    }

    .filmstrip-thumb-title {
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Interactive Audio Bench */
    .audio-bench-card {
      background: var(--sub-card-bg) !important;
      border: 1px solid var(--ligne) !important;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: background-color 0.25s ease;
    }

    .audio-vertical-stamp {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      color: var(--texte-mute);
      opacity: 0.7;
      pointer-events: none;
    }

    /* Poster Bottom Bar & Barcode */
    .poster-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
      border-top: 1px solid var(--ligne);
      padding-top: 1.25rem;
      margin-top: 1rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--texte-mute);
    }

    .poster-links-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .poster-link-item {
      color: var(--texte-doux);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      transition: color 0.15s ease;
    }

    .poster-link-item:hover {
      color: var(--accent-fonce);
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="{{ '/antechamber/' | relative_url }}" style="font-family: var(--font-poster-sans); font-weight: 800; letter-spacing: -0.01em;">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/' | relative_url }}" aria-current="page">Poster &amp; Lab</a></li>
          <li><a href="{{ '/antechamber/notes.html' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">Behind the Curtain</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button type="button" class="cmd-k-btn" id="cmd-k-trigger" aria-label="Open Quick Actions (⌘K)" title="Quick Actions (⌘K)">
          <span class="cmd-k-btn-icon">⚡</span>
          <span class="cmd-k-btn-text">Actions</span>
          <kbd class="cmd-k-btn-kbd">⌘K</kbd>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
          <span class="theme-icon">☀️</span>
        </button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span> 
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez · The Antechamber</p>
    <p style="margin-top: 0.75rem; text-align: center;">
      <a href="{{ '/' | relative_url }}" style="color: var(--texte-doux); text-decoration: none; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 8px;" title="Back to main portfolio" aria-label="Back to main portfolio">
        <span>💼</span>
        <span style="font-size: 0.85rem; font-family: -apple-system, sans-serif;">Exit to Main Portfolio</span>
      </a>
    </p>
  </footer>

  <script>
    (function() {
      const themeBtn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const themeIcon = document.querySelector('.theme-icon');
      
      const currentTheme = localStorage.getItem('ncg-theme') || localStorage.getItem('theme') || 'dark';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeIcon) {
          themeIcon.textContent = (theme === 'dark') ? '☀️' : '🌙';
        }
      }

      setTheme(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const current = root.getAttribute('data-theme') || root.dataset.theme || 'dark';
          const newTheme = (current === 'dark') ? 'light' : 'dark';
          playMechanicalClick();
          setTheme(newTheme);
        });
      }
    })();
  </script>
  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
  <script src="{{ '/assets/quick-actions.js' | relative_url }}"></script>
</body>
</html>
