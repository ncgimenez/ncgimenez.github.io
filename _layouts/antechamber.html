<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | The Antechamber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css?v=2.9' | relative_url }}">

  <style>
    /* ============================================================
       Antichambre : Sanctuarisation des couleurs & Design Éditorial
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) */
    :root,
    :root[data-theme="dark"] {
      --fond: #0b0912 !important;
      --fond-carte: #14111f !important;
      --fond-carte-hover: #1c182d !important;
      --canvas-bg: #0d0a16 !important;
      --sub-card-bg: #120e20 !important;
      --texte: #f4eeff !important;
      --texte-doux: #9d91ba !important;
      --texte-mute: #6b5f88 !important;
      --accent: #a855f7 !important;
      --accent-fonce: #c084fc !important;
      --accent-or: #f59e0b !important;
      --accent-cyan: #38bdf8 !important;
      --ligne: #27203b !important;
      --ligne-fine: rgba(255, 255, 255, 0.08);
      --halo-couleur: rgba(168, 85, 247, 0.16);
      --shadow-poster: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(168, 85, 247, 0.08);
      --stage-mat-bg: #08060e;
      --font-poster-sans: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-poster-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* 2. Mode clair adouci */
    :root[data-theme="light"] {
      --fond: #f2edf7 !important;
      --fond-carte: #ffffff !important;
      --fond-carte-hover: #f9f7fc !important;
      --canvas-bg: #faf7fd !important;
      --sub-card-bg: #ffffff !important;
      --texte: #1d1929 !important;
      --texte-doux: #5f5478 !important;
      --texte-mute: #8c82a5 !important;
      --accent: #7e22ce !important;
      --accent-fonce: #6b21a8 !important;
      --accent-or: #d97706 !important;
      --accent-cyan: #0284c7 !important;
      --ligne: #ded4ea !important;
      --ligne-fine: rgba(0, 0, 0, 0.08);
      --halo-couleur: rgba(126, 34, 206, 0.08);
      --shadow-poster: 0 16px 40px rgba(95, 84, 120, 0.1);
      --stage-mat-bg: #130f1d;
    }

    /* Halo lumineux d'ambiance */
    body {
      background-color: var(--fond) !important;
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% -10%, var(--halo-couleur), transparent),
        radial-gradient(ellipse 60% 40% at 85% 60%, rgba(56, 189, 248, 0.05), transparent) !important;
      background-repeat: no-repeat !important;
      transition: background-color 0.25s ease, color 0.25s ease;
      color: var(--texte) !important;
      min-height: 100vh;
      margin: 0;
    }

    /* ============================================================
       LAYOUT : MAIN CONTENT + RIGHT VERTICAL SIDEBAR
       ============================================================ */
    .antechamber-layout {
      min-height: 100vh;
      width: 100%;
      position: relative;
      background: var(--fond);
    }

    /* Main viewport takes all space minus sidebar, perfectly centered */
    main.antechamber-main-viewport,
    .antechamber-main-viewport {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 2rem 1.5rem 5rem !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }

    @media (min-width: 901px) {
      main.antechamber-main-viewport,
      .antechamber-main-viewport {
        width: calc(100% - 270px) !important;
        margin-left: 0 !important;
        margin-right: 270px !important;
        padding: 2.5rem 3rem 6rem !important;
      }
    }

    /* RIGHT VERTICAL SIDEBAR (DESKTOP) */
    .antechamber-sidebar-right {
      position: fixed;
      top: 0;
      right: 0;
      width: 270px;
      height: 100vh;
      background: var(--canvas-bg);
      border-left: 1px solid var(--ligne);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1.5rem;
      z-index: 100;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    /* TOP LOGO & COORDINATES IN SIDEBAR */
    .sidebar-brand-block {
      border-bottom: 1px solid var(--ligne);
      padding-bottom: 1.25rem;
    }

    .sidebar-brand-title {
      font-family: var(--font-poster-sans);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--texte);
      display: block;
      line-height: 1.1;
    }

    .sidebar-brand-title span {
      color: var(--accent);
    }

    .sidebar-coords {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--texte-mute);
      letter-spacing: 0.1em;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
    }

    /* ROOM NAVIGATION LINKS */
    .sidebar-nav {
      margin: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--texte-doux);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .sidebar-nav-item:hover {
      background: rgba(168, 85, 247, 0.08);
      color: var(--texte);
      border-color: var(--ligne-fine);
      transform: translateX(-2px);
    }

    .sidebar-nav-item.is-active {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent);
      color: var(--accent-fonce);
      font-weight: 600;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
    }

    .sidebar-nav-num {
      font-size: 0.68rem;
      color: var(--texte-mute);
      font-weight: 400;
    }

    .sidebar-nav-item.is-active .sidebar-nav-num {
      color: var(--accent-fonce);
    }

    /* SIDEBAR BOTTOM CONTROLS */
    .sidebar-controls-block {
      border-top: 1px solid var(--ligne);
      padding-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-action-btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-cmd-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--fond-carte);
      border: 1px solid var(--ligne);
      color: var(--texte);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sidebar-cmd-btn:hover {
      border-color: var(--accent);
      background: var(--fond-carte-hover);
    }

    .sidebar-theme-btn {
      width: 36px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: var(--fond-carte);
      border: 1px solid var(--ligne);
      color: var(--texte);
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.15s ease;
    }

    .sidebar-theme-btn:hover {
      border-color: var(--accent);
    }

    .sidebar-exit-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.05);
      border: 1px dashed var(--ligne);
      text-decoration: none;
      color: var(--texte-doux);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      transition: all 0.15s ease;
    }

    .sidebar-exit-link:hover {
      color: var(--texte);
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    /* RESPONSIVE MOBILE BAR (HIDDEN BY DEFAULT ON DESKTOP) */
    .antechamber-mobile-header,
    .mobile-rooms-drawer {
      display: none !important;
    }

    @media (max-width: 900px) {
      .antechamber-sidebar-right {
        display: none !important;
      }

      .antechamber-main-viewport {
        padding: 1.25rem 1.25rem 4rem !important;
        margin-right: 0 !important;
        width: 100% !important;
      }

      .antechamber-mobile-header {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        background: var(--canvas-bg);
        border-bottom: 1px solid var(--ligne);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .mobile-rooms-drawer {
        display: flex !important;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 1.25rem;
        background: var(--fond);
        border-bottom: 1px solid var(--ligne);
        white-space: nowrap;
      }

      .mobile-room-pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--fond-carte);
        border: 1px solid var(--ligne);
        text-decoration: none;
        color: var(--texte-doux);
        font-family: var(--font-mono);
        font-size: 0.72rem;
      }

      .mobile-room-pill.is-active {
        background: rgba(168, 85, 247, 0.15);
        border-color: var(--accent);
        color: var(--accent-fonce);
        font-weight: 600;
      }
    }

    /* POSTER AESTHETICS */
    .art-poster-canvas {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      box-sizing: border-box;
      border: 1px solid var(--ligne) !important;
      background: var(--canvas-bg) !important;
      position: relative;
      box-shadow: var(--shadow-poster) !important;
      border-radius: 6px;
      padding: 2.5rem 3rem;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    @media (max-width: 768px) {
      .art-poster-canvas {
        padding: 1.5rem 1.25rem;
      }
    }

    /* Registration marks */
    .corner-mark {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.7;
      line-height: 1;
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 10px; }
    .corner-tr { top: 8px; right: 10px; }
    .corner-bl { bottom: 8px; left: 10px; }
    .corner-br { bottom: 8px; right: 10px; }

    /* Headline Title */
    .poster-main-title {
      font-family: var(--font-poster-sans);
      font-size: clamp(2.4rem, 5.5vw, 4.6rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--texte);
      margin: 0 0 1rem;
    }

    .poster-the-small {
      font-family: inherit;
      font-size: 0.38em;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-fonce);
      display: inline-block;
      vertical-align: 0.2em;
      margin-right: 0.45rem;
    }

    .poster-title-highlight {
      color: var(--accent);
      text-shadow: 0 0 35px rgba(168, 85, 247, 0.35);
    }
  </style>
</head>
<body>

  <!-- MOBILE NAVIGATION HEADER (@media max-width: 900px) -->
  <header class="antechamber-mobile-header">
    <a href="{{ '/antechamber/' | relative_url }}" style="font-family: var(--font-poster-sans); font-weight: 800; text-decoration: none; color: var(--texte); font-size: 1rem;">
      THE ANTI<span style="color: var(--accent);">CHAMBER</span>
    </a>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" class="sidebar-theme-btn theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">☀️</span>
      </button>
      <a href="{{ '/' | relative_url }}" class="sidebar-theme-btn" title="Exit to Portfolio" style="text-decoration: none;">
        <span>💼</span>
      </a>
    </div>
  </header>

  <nav class="mobile-rooms-drawer" aria-label="Mobile Navigation">
    <a href="{{ '/antechamber/' | relative_url }}" class="mobile-room-pill {% if page.url == '/antechamber/' %}is-active{% endif %}">00 Foyer</a>
    <a href="{{ '/antechamber/lens.html' | relative_url }}" class="mobile-room-pill {% if page.url contains 'lens' %}is-active{% endif %}">01 The Lens</a>
    <a href="{{ '/antechamber/sound.html' | relative_url }}" class="mobile-room-pill {% if page.url contains 'sound' %}is-active{% endif %}">02 Sound Lab</a>
    <a href="{{ '/antechamber/notes.html' | relative_url }}" class="mobile-room-pill {% if page.url contains 'notes' %}is-active{% endif %}">03 Reading &amp; Notes</a>
    <a href="{{ '/antechamber/about.html' | relative_url }}" class="mobile-room-pill {% if page.url contains 'about' %}is-active{% endif %}">04 Behind the Curtain</a>
  </nav>

  <!-- MAIN TWO-COLUMN CONTAINER -->
  <div class="antechamber-layout">

    <!-- LEFT / CENTER: ACTIVE VIEWPORT -->
    <main class="antechamber-main-viewport">
      {{ content }}
    </main>

    <!-- RIGHT: FIXED VERTICAL SIDEBAR (DESKTOP) -->
    <aside class="antechamber-sidebar-right" aria-label="Sidebar Navigation">
      
      <!-- TOP: BRAND & COORDINATES -->
      <div class="sidebar-brand-block">
        <a href="{{ '/antechamber/' | relative_url }}" class="sidebar-brand-title">
          THE ANTI<br><span>CHAMBER</span>
        </a>
        <div class="sidebar-coords">
          <span>ATELIER 2026</span>
          <span>50°50'N 4°21'E</span>
        </div>
      </div>

      <!-- MIDDLE: ROOMS NAVIGATION (SEPARATE SUBJECTS) -->
      <nav class="sidebar-nav">
        <a href="{{ '/antechamber/' | relative_url }}" class="sidebar-nav-item {% if page.url == '/antechamber/' %}is-active{% endif %}">
          <span class="sidebar-nav-num">00</span>
          <span>Foyer (Index)</span>
        </a>

        <a href="{{ '/antechamber/lens.html' | relative_url }}" class="sidebar-nav-item {% if page.url contains 'lens' %}is-active{% endif %}">
          <span class="sidebar-nav-num">01</span>
          <span>The Lens 📸</span>
        </a>

        <a href="{{ '/antechamber/sound.html' | relative_url }}" class="sidebar-nav-item {% if page.url contains 'sound' %}is-active{% endif %}">
          <span class="sidebar-nav-num">02</span>
          <span>Sound Lab 🎹</span>
        </a>

        <a href="{{ '/antechamber/notes.html' | relative_url }}" class="sidebar-nav-item {% if page.url contains 'notes' %}is-active{% endif %}">
          <span class="sidebar-nav-num">03</span>
          <span>Reading &amp; Notes 📚</span>
        </a>

        <a href="{{ '/antechamber/about.html' | relative_url }}" class="sidebar-nav-item {% if page.url contains 'about' %}is-active{% endif %}">
          <span class="sidebar-nav-num">04</span>
          <span>Behind Curtain 🎭</span>
        </a>
      </nav>

      <!-- BOTTOM: ACTIONS, THEME TOGGLE, EXIT -->
      <div class="sidebar-controls-block">
        <div class="sidebar-action-btn-row">
          <button type="button" class="sidebar-cmd-btn" id="cmd-k-trigger" aria-label="Open Quick Actions (⌘K)" title="Quick Actions (⌘K)">
            <span>⚡ Actions</span>
            <kbd style="font-size: 0.65rem; background: rgba(168,85,247,0.15); padding: 2px 4px; border-radius: 4px;">⌘K</kbd>
          </button>
          <button type="button" class="sidebar-theme-btn theme-toggle" id="theme-toggle" aria-label="Changer de thème">
            <span class="theme-icon">☀️</span>
          </button>
        </div>

        <a href="{{ '/' | relative_url }}" class="sidebar-exit-link" title="Exit to professional engineering portfolio">
          <span>💼 Portfolio Pro</span>
          <span>→</span>
        </a>
      </div>

    </aside>

  </div>

  <!-- THEME TOGGLE & MECHANICAL CLICK SCRIPT -->
  <script>
    (function() {
      const themeBtns = document.querySelectorAll('.theme-toggle');
      const root = document.documentElement;
      
      const currentTheme = localStorage.getItem('ncg-theme') || localStorage.getItem('theme') || 'dark';
      
      function playMechanicalClick() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        } catch(e) {}
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        root.dataset.theme = theme;
        localStorage.setItem('ncg-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-icon').forEach(icon => {
          icon.textContent = (theme === 'dark') ? '☀️' : '🌙';
        });
      }

      setTheme(currentTheme);

      themeBtns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const current = root.getAttribute('data-theme') || root.dataset.theme || 'dark';
          const newTheme = (current === 'dark') ? 'light' : 'dark';
          playMechanicalClick();
          setTheme(newTheme);
        });
      });
    })();
  </script>
  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
  <script src="{{ '/assets/quick-actions.js' | relative_url }}"></script>
</body>
</html>
