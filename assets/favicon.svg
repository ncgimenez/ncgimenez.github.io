<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #0e0d11; }
    .mark { fill: #fcfcfd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.04em; }
    .dot { fill: #f0714b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fcfcfd; }
      .mark { fill: #0e0d11; }
      .dot { fill: #f0714b; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="15"/>
  <text class="mark" x="29" y="44" text-anchor="middle">N</text>
  <circle class="dot" cx="45" cy="40" r="3.5"/>
</svg>
